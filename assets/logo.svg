<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" role="img" aria-label="veilbrowser logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset=".55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="veil" x1="12" y1="30" x2="116" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ddd6fe" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="win"><rect x="18" y="32" width="92" height="66" rx="9"/></clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>

  <!-- browser window -->
  <rect x="18" y="32" width="92" height="66" rx="9" fill="#0b0921" opacity=".55"/>
  <circle cx="28" cy="40" r="2.6" fill="#f472b6"/>
  <circle cx="37" cy="40" r="2.6" fill="#fbbf24"/>
  <circle cx="46" cy="40" r="2.6" fill="#34d399"/>
  <path d="M18 48 h92" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>

  <!-- fingerprint whorl -->
  <g clip-path="url(#win)" fill="none" stroke="#c7d2fe" stroke-width="3.4" stroke-linecap="round" opacity=".9">
    <path d="M64 84c-10 0-18-8-18-18s8-18 18-18 18 8 18 18"/>
    <path d="M64 84c-5 0-9-4-9-9s4-9 9-9 9 4 9 9"/>
    <path d="M46 52c4-6 12-8 18-4"/>
    <path d="M64 84c6 3 13 1 18-6"/>
  </g>

  <!-- veil drape across the identity -->
  <g clip-path="url(#win)">
    <path d="M12 44 C 42 32, 64 62, 116 40 L116 55 C 68 78, 44 48, 12 60 Z" fill="url(#veil)" opacity=".26"/>
    <path d="M12 58 C 42 46, 64 76, 116 54 L116 72 C 68 96, 44 66, 12 78 Z" fill="url(#veil)" opacity=".4"/>
  </g>
</svg>
